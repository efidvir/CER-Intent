apiVersion: v1
kind: Service
metadata:
  name: {{ include "cer-intent.name" . }}
  labels: {{- include "cer-intent.labels" . | nindent 4 }}
spec:
  selector: {{- include "cer-intent.labels" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
    {{- if .Values.mcp.enabled }}
    - {name: mcp, port: {{ .Values.mcp.port }}, targetPort: mcp}
    {{- end }}
