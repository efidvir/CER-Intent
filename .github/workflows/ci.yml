name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pip install ./ceragon_tfs_adapter
      - run: python -m pytest tests ceragon_tfs_adapter/tests -q

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/cer-intent
      - run: helm template cer deploy/helm/cer-intent > /dev/null
      - run: helm template cer deploy/helm/cer-intent --set teraflow.credentialsSecret=tfs,llm.secret=llm,twin.url=http://twin:9100 > /dev/null

  image:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cer-intent:ci
